name: Deploy public download site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate before deploy
        run: |
          npm ci
          npm test
          npm run bundle
          test -f dist/site-server.mjs
      - name: Open-source safety check (when provided)
        if: hashFiles('scripts/check-open-source.mjs') != ''
        run: node scripts/check-open-source.mjs
      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Sync public site source to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            --exclude node_modules --exclude .git --exclude release --exclude dist \
            --exclude data --exclude sessions --exclude downloads \
            --exclude handoff --exclude migration --exclude secrets \
            --exclude .env --exclude .env.local --exclude .env.production \
            --exclude deploy/keys --exclude .DS_Store \
            --exclude /peergrading/ --exclude __MACOSX --exclude /换电脑先读.txt \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/srv/peergrading/"
      - name: Rebuild and restart public site
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" 'bash /srv/peergrading/deploy/deploy.sh'
      - name: Smoke test public downloads and removed legacy APIs
        run: |
          set -euo pipefail
          base="https://peergrading.ai"
          curl -fsS --retry 10 --retry-delay 5 --retry-connrefused -o /dev/null "$base/"
          curl -fsS --retry 3 --retry-delay 2 "$base/installers.json" | node -e '
            let body = "";
            process.stdin.on("data", chunk => { body += chunk; });
            process.stdin.on("end", () => {
              const value = JSON.parse(body);
              if (!value || typeof value !== "object") {
                throw new Error("installers.json must be a JSON object or array");
              }
            });
          '
          expect_404() {
            method="$1"
            path="$2"
            code="$(curl -sS -o /dev/null -w '%{http_code}' -X "$method" "$base$path")"
            if [ "$code" != "404" ]; then
              echo "Expected $method $path to return 404, got $code"
              return 1
            fi
          }
          expect_404 GET /api/download/latest
          expect_404 POST /api/device/start
