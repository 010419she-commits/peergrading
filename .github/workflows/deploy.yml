# 推送到 main 时自动部署到服务器：GitHub 的机器拉取代码 → rsync 到服务器 → 重建容器。
# 需要在仓库 Settings → Secrets and variables → Actions 里添加三个 secret：
#   DEPLOY_HOST = 66.42.99.212   DEPLOY_USER = root   DEPLOY_SSH_KEY = deploy/keys/github-actions 文件的全部内容（私钥）
name: Deploy to peergrading.ai
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy-production
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate before deploy
        run: |
          npm ci
          npm test
          npm run bundle
      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Sync code to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            --exclude node_modules --exclude .git --exclude release --exclude dist \
            --exclude data --exclude sessions --exclude downloads --exclude .env \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/srv/peergrading/"
      - name: Rebuild and restart
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" 'bash /srv/peergrading/deploy/deploy.sh'
      - name: Smoke test
        run: |
          sleep 8
          curl -fsS -o /dev/null -w "https://peergrading.ai -> %{http_code}\n" https://peergrading.ai/
