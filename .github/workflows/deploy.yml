# 推送到 main 时自动部署到服务器。需要在 GitHub 仓库 Settings → Secrets 里添加：
#   DEPLOY_HOST（服务器 IP 或域名）、DEPLOY_USER（如 root）、DEPLOY_SSH_KEY（能登录服务器的私钥）
name: Deploy to peergrading.ai
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: /srv/peergrading/deploy/deploy.sh
