<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><meta name="robots" content="noindex">
  <title>连接桌面软件 · PeerGrading</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500&display=swap">
  <link rel="stylesheet" href="/site.css">
</head>
<body>
  <header class="site-header"><div class="wrap header-inner">
    <a class="brand" href="/"><span class="brand-name" data-i18n="brand">PeerGrading</span><span class="brand-caption" data-i18n="brandCaption">双 Agent 协作循环</span></a>
    <div class="header-right"><div class="nav-auth" id="nav-auth"></div><div class="lang-seg"><button type="button" data-lang="zh">中文</button><button type="button" data-lang="en">EN</button></div></div>
  </div></header>
  <main id="main">
    <section class="section narrow">
      <p class="eyebrow" data-i18n="deviceEyebrow">桌面软件</p>
      <h2 data-i18n="deviceTitle">连接桌面软件到你的账号</h2>
      <p class="lead" style="margin-top:20px" data-i18n="deviceLead">把软件里显示的 8 位配对码填到下面并确认。确认后，软件就会使用你账号的试用或会员资格，识别本机 agent、剪贴板中转等功能都在你自己的电脑上运行。</p>
      <div id="device-root" class="stack" style="margin-top:32px">
        <label><span data-i18n="deviceCodeLabel">配对码</span><input id="device-code" placeholder="ABCD-EFGH" maxlength="9" autocomplete="off" style="font-family:ui-monospace,Menlo,monospace;font-size:24px;letter-spacing:.2em;text-transform:uppercase"></label>
        <div class="ops"><button class="button button-primary" id="device-approve" type="button" data-i18n="deviceApprove">确认连接</button><button class="text-link" id="device-deny" type="button" data-i18n="deviceDeny">这不是我的软件</button></div>
        <div class="notice" id="device-status" hidden></div>
      </div>
    </section>
  </main>
  <dialog class="modal" id="login-modal" aria-labelledby="login-title"><div class="modal-panel">
    <button class="modal-close" type="button" data-close aria-label="关闭">×</button>
    <p class="eyebrow" id="login-eyebrow">欢迎</p><h2 id="login-title" style="font-size:28px">登录</h2><p class="muted" id="login-desc"></p>
    <div class="login-buttons" id="login-buttons"></div>
  </div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="/site-i18n.js"></script><script src="/site.js"></script>
</body>
</html>
