<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark">
  <title>连接账号 · PeerGrading</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500&display=swap">
  <link rel="stylesheet" href="/site.css">
  <style>
    .code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: clamp(36px, 6vw, 64px); letter-spacing: .18em; color: var(--accent); border: 1px solid var(--line); padding: 20px 28px; text-align: center; background: var(--surface); }
    .pair-steps { display: grid; gap: 10px; color: var(--muted); font-size: 15px; padding-left: 1.2em; }
  </style>
</head>
<body>
  <main id="main">
    <section class="section narrow">
      <p class="eyebrow">PeerGrading</p>
      <h2>把这台电脑连接到你的账号</h2>
      <p class="lead" style="margin-top:20px">软件在你自己的电脑上运行：识别本机 agent、剪贴板中转、一键发送都在本地完成。只有试用与会员资格需要向 <span id="cloud"></span> 核对一次。</p>
      <div class="stack" style="margin-top:32px">
        <div id="step-start"><button class="button button-primary" id="start" type="button">生成配对码</button><span class="muted" id="err" style="margin-left:14px"></span></div>
        <div id="step-code" hidden>
          <div class="code" id="code"></div>
          <ol class="pair-steps" style="margin-top:20px">
            <li>点下面的按钮，在浏览器里打开 PeerGrading 并登录（首次登录会自动创建账号）。</li>
            <li>网页上会预填这个配对码，点「确认连接」。</li>
            <li>回到这里，软件会自动完成连接。</li>
          </ol>
          <div class="ops" style="margin-top:20px"><a class="button button-primary" id="open" href="#" target="_blank" rel="noopener">在浏览器中登录并确认</a><span class="muted" id="status">等待确认中…</span></div>
        </div>
      </div>
      <p class="fine">没有账号？在浏览器里登录时会自动创建，并立即获得免费试用。</p>
      <details style="margin-top:28px"><summary class="muted" style="cursor:pointer;font-size:13px">高级：云端地址</summary>
        <div class="ops" style="margin-top:12px"><input id="cloud-url" style="max-width:360px" placeholder="https://peergrading.ai"><button class="button small" id="cloud-save" type="button">保存</button><span class="muted" id="cloud-msg"></span></div>
        <p class="fine">只在自建服务器或本机开发（例如 http://localhost:3001）时需要改；留空恢复默认。</p>
      </details>
    </section>
  </main>
  <script>
    (async () => {
      const $ = (s) => document.querySelector(s);
      const boot = await (await fetch("/api/auth/bootstrap")).json();
      $("#cloud").textContent = boot.cloudUrl.replace(/^https?:\/\//, "");
      if (boot.paired && boot.user) return location.replace("/app");
      if (boot.lastError) $("#err").textContent = boot.lastError;
      $("#cloud-url").value = boot.cloudUrl === boot.cloudDefault ? "" : boot.cloudUrl; $("#cloud-url").placeholder = boot.cloudDefault;
      $("#cloud-save").onclick = async () => {
        const r = await fetch("/api/local/cloud", { method: "POST", headers: { "content-type": "application/json", "x-csrf-token": boot.csrf }, body: JSON.stringify({ url: $("#cloud-url").value }) });
        const d = await r.json(); $("#cloud-msg").textContent = r.ok ? "已保存：" + d.cloudUrl : (d.error || "失败"); if (r.ok) { $("#cloud").textContent = d.cloudUrl.replace(/^https?:\/\//, ""); $("#step-start").hidden = false; $("#start").disabled = false; $("#step-code").hidden = true; }
      };
      let timer;
      $("#start").onclick = async () => {
        $("#start").disabled = true; $("#err").textContent = "";
        const r = await fetch("/api/local/pair/start", { method: "POST", headers: { "content-type": "application/json", "x-csrf-token": boot.csrf }, body: "{}" });
        const d = await r.json();
        if (!r.ok) { $("#err").textContent = d.error || "无法连接云端"; $("#start").disabled = false; return; }
        $("#code").textContent = d.userCode; $("#open").href = d.verificationUrl; $("#step-code").hidden = false; $("#step-start").hidden = true;
        timer = setInterval(async () => {
          const s = await (await fetch("/api/local/pair/status")).json();
          if (s.status === "approved" || s.paired) { clearInterval(timer); $("#status").textContent = "已连接，正在进入…"; location.replace("/app"); }
          else if (s.status === "expired" || s.status === "denied") { clearInterval(timer); $("#status").textContent = s.status === "denied" ? "配对被拒绝。" : "配对码已过期，请重新生成。"; $("#step-start").hidden = false; $("#start").disabled = false; $("#step-code").hidden = true; }
        }, 3000);
      };
    })();
  </script>
</body>
</html>
