<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><meta name="robots" content="noindex,nofollow">
  <title>后台 · PeerGrading</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500&display=swap">
  <link rel="stylesheet" href="/site.css">
  <style>
    .admin h3 { margin: 48px 0 16px; }
    .admin .card { border: 1px solid var(--line); background: var(--surface); padding: 24px; display: grid; gap: 14px; }
    .admin .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; align-items: start; }
    .admin label { display: grid; gap: 6px; font-size: 14px; color: var(--muted); }
    .admin label.inline { display: flex; align-items: center; gap: 10px; color: var(--ink); font-size: 15px; }
    .admin input[type=text], .admin input[type=number], .admin textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--control-line); background: var(--bg); color: var(--ink); font: inherit; font-size: 15px; }
    .admin textarea { min-height: 90px; resize: vertical; }
    .admin input[type=number] { max-width: 12em; }
    .admin input[type=checkbox] { width: 18px; height: 18px; }
    .admin img.preview { max-width: 200px; border: 1px solid var(--line); display: block; }
    .admin .stats { display: flex; flex-wrap: wrap; gap: 10px 28px; color: var(--muted); font-size: 15px; }
    .admin .stats b { color: var(--ink); font-weight: 500; }
    .admin table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    .admin th, .admin td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
    .admin th { color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--surface); }
    .admin td.wrap-cell { white-space: normal; }
    .admin .table-wrap { overflow: auto; max-height: 70vh; border: 1px solid var(--line); background: var(--surface); }
    .admin .tag { display: inline-block; font-size: 11px; letter-spacing: .08em; padding: 2px 7px; border: 1px solid var(--control-line); border-radius: 999px; color: var(--muted); margin-left: 6px; }
    .admin .tag.ok { border-color: var(--ok); color: var(--ok); } .admin .tag.warn { border-color: var(--warn); color: var(--warn); }
    .admin .mini { min-height: 32px; padding: 4px 10px; font-size: 13px; }
    .admin input.mini { width: 5em; padding: 4px 8px; font-size: 13px; }
    .admin .fine { margin-top: 0; }
  </style>
</head>
<body>
  <header class="site-header"><div class="wrap header-inner">
    <a class="brand" href="/"><span class="brand-name" data-i18n="brand">PeerGrading</span><span class="brand-caption" data-i18n="brandCaption">双 Agent 协作循环</span></a>
    <nav class="primary-nav" aria-label="主导航"><a href="/account" data-i18n="account">账号</a><a href="/#pricing" data-i18n="navPricing">定价</a></nav>
    <div class="header-right"><div class="nav-auth" id="nav-auth"></div><div class="lang-seg"><button type="button" data-lang="zh">中文</button><button type="button" data-lang="en">EN</button></div></div>
  </div></header>
  <main id="main">
    <section class="section">
      <div class="wrap admin">
        <p class="eyebrow">后台</p>
        <h2>站主后台</h2>
        <p class="muted">内测开关、收款设置、早鸟与邀请参数、微信群入口、用户剩余天数、订单确认。本页只有管理员可见。</p>
        <div id="admin-root"><p class="muted">加载中…</p></div>
      </div>
    </section>
  </main>
  <footer class="site-footer"><div class="wrap"><div>© <span id="year"></span> PeerGrading</div><nav><a href="/privacy" data-i18n="privacy">隐私政策</a><a href="/terms" data-i18n="terms">服务条款</a></nav></div></footer>
  <dialog class="modal" id="login-modal" aria-labelledby="login-title"><div class="modal-panel">
    <button class="modal-close" type="button" data-close aria-label="关闭">×</button>
    <p class="eyebrow" id="login-eyebrow">欢迎</p><h2 id="login-title" style="font-size:28px">登录</h2><p class="muted" id="login-desc"></p>
    <div class="login-buttons" id="login-buttons"></div>
  </div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="/site-i18n.js"></script><script src="/site.js"></script><script src="/admin.js"></script>
</body>
</html>
