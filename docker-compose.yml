# 无账号公网下载站点：docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      BASE_URL: ${BASE_URL:-https://peergrading.ai}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-010419she-commits/peergrading}
    ports:
      - "127.0.0.1:3000:3000" # 仅由本机 Caddy 对外提供 HTTPS
